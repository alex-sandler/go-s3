services:
  s3-service:
    container_name: s3-service
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - minio
    restart: unless-stopped
    environment:
      - HTTP_HOST
      - HTTP_PORT
      - MINIO_ENDPOINT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_BUCKET_NAME
      - MINIO_USE_SSL
      - IMAGE_QUALITY
      - IMAGE_MAX_WIDTH
  minio:
    container_name: minio
    image: 'minio/minio:RELEASE.2024-12-18T13-15-44Z'
    volumes:
      - 'minio_data:/data'
    ports:
      - '9000:9000' # АПИ
      - '9001:9001' # Веб консоль
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_USE_SSL: "${MINIO_USE_SSL}"
      MINIO_DEFAULT_BUCKETS: "${MINIO_BUCKET_NAME}"
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
volumes:
  minio_data: